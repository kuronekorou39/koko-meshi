name: koko_meshi
description: "撮るだけで食事を全自動記録する食事ログ＆グルメマップアプリ"
publish_to: 'none'
version: 0.9.6+19

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ローカルDB
  sqflite: ^2.4.2
  path: ^1.9.1

  # ルーティング
  go_router: ^14.8.1

  # カメラ・画像
  image_picker: ^1.1.2
  image: ^4.5.3

  # 位置情報
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # 地図
  google_maps_flutter: ^2.12.1

  # Google Places（HTTP経由で呼び出し）
  http: ^1.3.0

  # ローカルファイルパス
  path_provider: ^2.1.5

  # ネットワーク状態
  connectivity_plus: ^6.1.4

  # UUID生成
  uuid: ^4.5.1

  # 日付フォーマット
  intl: ^0.20.2

  # URL起動
  url_launcher: ^6.3.1

  # 環境変数
  flutter_dotenv: ^5.2.1
  table_calendar: ^3.2.0
  shared_preferences: ^2.5.4
  gal: ^2.3.2

  # バックアップ(zipエクスポート/復元・端末移行)
  archive: ^4.0.0
  share_plus: ^11.0.0
  file_picker: ^10.0.0

  # EXIF メタデータ読み取り
  exif: ^3.3.0
  package_info_plus: ^9.0.0
  camera: ^0.12.0+1

  # オンデバイスAI PoC: Gemma 4 E2B (vision, LiteRT-LM)
  flutter_gemma: ^1.2.3
  flutter_gemma_litertlm: ^1.0.4

  # 端末内AI解析中のフォアグラウンドサービス(プロセス凍結防止+進捗通知)
  flutter_foreground_task: ^10.0.0
  background_downloader: ^9.5.7

# vendorパッチ版: visual token budget(画像の実効解像度)を設定可能にする
# (pub.dev 1.0.4にはFFIバインディングだけあり公開APIが無い。詳細は
#  packages/flutter_gemma_litertlm/lib/src/visual_token_budget.dart)
dependency_overrides:
  flutter_gemma_litertlm:
    path: packages/flutter_gemma_litertlm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/poc_test/
    # フォント本体は fonts: 側で取り込まれる。ライセンス本文だけアセットにして
    # showLicensePage に出す(lib/main.dart の _registerFontLicenses)
    - assets/fonts/BIZUDGothic/OFL.txt

  # 本文フォント。日本語はサブセット化されないので1ウェイト約4.5MBかかる。
  # 数字の字幅が均一で価格・カロリーの桁が揃う等幅のUDゴシックを採用
  # (プロポーショナルの BIZ UDPGothic は字幅が不揃いで不可)。
  # 取得は `python tool/fetch_fonts.py`
  fonts:
    - family: BIZUDGothic
      fonts:
        - asset: assets/fonts/BIZUDGothic/BIZUDGothic-400.ttf
          weight: 400
        - asset: assets/fonts/BIZUDGothic/BIZUDGothic-700.ttf
          weight: 700

# アプリアイコン生成: `dart run flutter_launcher_icons` で mipmap 一式を作り直す。
# 素材は assets/icon/(assets/ は再帰的に取り込まれないのでAPKには入らない)。
# 元絵の加工内容は assets/icon/README.md を参照
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  # Adaptive Icon: 前景は透過のカメラ、背景は元絵と同じ薄紫
  adaptive_icon_background: "#CABCD6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # iOSのアイコンはアルファ不可
  remove_alpha_ios: true
  background_color_ios: "#CABCD6"
