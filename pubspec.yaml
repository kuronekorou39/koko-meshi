name: koko_meshi
description: "撮るだけで食事を全自動記録する食事ログ＆グルメマップアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ローカルDB
  sqflite: ^2.4.2
  path: ^1.9.1

  # ルーティング
  go_router: ^14.8.1

  # カメラ・画像
  image_picker: ^1.1.2
  image: ^4.5.3

  # 位置情報
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # 地図
  google_maps_flutter: ^2.12.1

  # Google Places（HTTP経由で呼び出し）
  http: ^1.3.0

  # Supabase（認証 + クラウドDB + ストレージ）
  supabase_flutter: ^2.9.0

  # ローカルファイルパス
  path_provider: ^2.1.5

  # ネットワーク状態
  connectivity_plus: ^6.1.4

  # UUID生成
  uuid: ^4.5.1

  # 日付フォーマット
  intl: ^0.20.2

  # URL起動
  url_launcher: ^6.3.1

  # 環境変数
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
