# リリースビルド: v* タグのpushで起動(手動起動も可)。
# Android は配布用APKを作ってReleaseに添付し、iOS は App Store Connect へ送る。
#
# Secrets が設定されていれば本番署名+実 .env、無ければ debug署名+ダミー .env
# でビルドだけ通す(その場合のAPKは署名が異なるため既存アプリに上書き不可)。
# iOS 側は署名まわりのSecretsが無ければ丸ごと飛ばすので、未設定でも失敗しない。
#
# 必要な Secrets (リポジトリ Settings > Secrets and variables > Actions):
#   DOTENV_BASE64      : .env を base64 したもの (Google Maps APIキー)
#   KEYSTORE_BASE64    : android/app/kokomeshi-release.keystore を base64 したもの
#   KEYSTORE_PASSWORD  : keystore のパスワード
#   KEY_ALIAS          : キーのエイリアス (kokomeshi)
#   KEY_PASSWORD       : キーのパスワード
#
#   ここから下は iOS の提出用。手順は docs/app-store-submission.md 参照
#   IOS_CERTIFICATE_BASE64          : Apple Distribution 証明書(.p12)を base64
#   IOS_CERTIFICATE_PASSWORD        : その .p12 のパスワード
#   IOS_APPSTORE_PROFILE_BASE64     : App Store 用プロビジョニングプロファイルを base64
#   APPSTORE_API_KEY_ID             : App Store Connect APIキーのID
#   APPSTORE_API_ISSUER_ID          : 同 Issuer ID
#   APPSTORE_API_PRIVATE_KEY        : AuthKey_xxx.p8 の中身そのもの
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release 作成に必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env を復元 (Secret が無ければダミー)
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        run: |
          if [ -n "$DOTENV_BASE64" ]; then
            echo "$DOTENV_BASE64" | base64 -d > .env
            echo ".env restored from secret"
          else
            echo "# CI dummy (DOTENV_BASE64 secret 未設定)" > .env
            echo "WARNING: dummy .env — 地図機能はこのAPKでは動きません"
          fi

      - name: 署名キーを復元 (Secret があれば本番署名)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/kokomeshi-release.keystore
            {
              echo "storeFile=kokomeshi-release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-kokomeshi}"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "release keystore restored"
          else
            echo "WARNING: KEYSTORE_BASE64 未設定 — debug署名でビルドします"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # ローカル開発環境と揃える (Dart 3.12)
          cache: true

      - run: flutter pub get

      # arm64 + 32bit(arm)。x86_64 はエミュレータ用なので入れない
      # (指定しないと Flutter 本体の .so がその分まで入って20MB強増える)。
      # 32bit端末では端末内AIだけが使えない状態でアプリが動く
      - run: flutter build apk --release --target-platform android-arm64,android-arm

      # 名前は pubspec の version から作る(アプリ内の表示と同じ出どころ)。
      # タグから作るリリースは配布物そのものなので kokomeshi-v0.9.5.apk と
      # 素直に。手動起動は同じバージョンで何度も回すため、ビルド番号と
      # 短縮SHAまで足して手元で見分けられるようにする
      - name: 成果物をアプリ名+バージョンにリネーム
        run: |
          V=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="kokomeshi-v${V%%+*}.apk"
          else
            NAME="kokomeshi-v${V%%+*}-b${V##*+}-$(git rev-parse --short HEAD).apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: GitHub Release を作成してAPKを添付
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          # -rc などの試し打ちタグは prerelease にする。そうしないと最新版扱いに
          # なり、アプリの「更新があります」が試し打ちを指してしまう
          prerelease: ${{ contains(github.ref_name, '-') }}

      # タグ以外(手動起動)ではReleaseを作らないので、確認用に成果物として残す。
      # タグ付きのときは上でReleaseに恒久的に添付されるため、同じAPKを成果物
      # にも上げると容量を二重に食う(150MB×リリース数で上限に達した実績あり)
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 7

  # ── App Store へ提出する IPA ──
  #
  # 手元がWindowsでXcodeを持たないので、署名も書き出しもアップロードもここでやる。
  # 署名まわりのSecretsが無いうちは各ステップが飛ぶだけで、失敗にはならない。
  ios-appstore:
    # Apple の要件(2026-04-28以降)で iOS 26 SDK / Xcode 26 以降が要る。
    # macos-latest だと世代が変わったときに黙って古いSDKになりうるので固定する
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      # ios/Podfile が .env を読んで Env.xcconfig を作る。
      # 提出物なので、キーが無いままビルドを通してしまわないよう落とす
      - name: .env を復元
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        run: |
          if [ -z "$DOTENV_BASE64" ]; then
            echo "DOTENV_BASE64 が未設定です。地図の出ないIPAを提出しても通らないので中止します"
            exit 1
          fi
          echo "$DOTENV_BASE64" | base64 -d > .env

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # 他のワークフローとローカルに揃える
          cache: true

      - run: flutter pub get

      - name: 署名証明書をキーチェーンに入れる
        if: env.IOS_CERTIFICATE_BASE64 != ''
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: プロビジョニングプロファイルを置く
        if: env.IOS_APPSTORE_PROFILE_BASE64 != ''
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/kokomeshi-appstore.mobileprovision

      # archive の前段として必須。条件付きにしてはいけない。
      # このステップが ios/Flutter/ephemeral のパッケージ解決とプラグイン統合を
      # やっていて、飛ばすと GeneratedPluginRegistrant.m が参照するモジュールが
      # 見つからず archive が落ちる。提出物はこの下の archive が署名して作る
      - name: iOS ビルド (署名なし・プラグイン統合のため)
        run: flutter build ios --release --no-codesign

      # 2024年5月以降、これが無いとアップロードで弾かれる。
      # pbxproj への登録漏れはコンパイルが通ってしまい気づけないので門にする
      - name: プライバシーマニフェストの同梱を確認
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "PrivacyInfo.xcprivacy が Runner.app に入っていません"
            exit 1
          fi
          plutil -lint "$APP/PrivacyInfo.xcprivacy"

      - name: 署名して IPA を書き出す
        if: env.IOS_APPSTORE_PROFILE_BASE64 != ''
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          echo "=== 使える署名 ==="
          security find-identity -v -p codesigning || true

          # flutter build ipa は Development 証明書を要求するが、CIにあるのは
          # Distribution だけなので xcodebuild を直接呼ぶ。
          #
          # 署名設定は xcodebuild の引数では渡さない。引数で渡すとワークスペース内の
          # 全ターゲットに効いてしまい、パッケージ由来のリソースバンドルが
          # "does not support provisioning profiles" で archive を失敗させる。
          # Runner の xcconfig に書けば Runner だけに掛かる
          cat >> ios/Flutter/Release.xcconfig <<'EOF'

          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = M5D5CQRGX8
          PROVISIONING_PROFILE_SPECIFIER = KokoMeshi AppStore
          EOF

          ARCHIVE_PATH=$RUNNER_TEMP/Runner.xcarchive
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions-AppStore.plist

          V=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          NAME="kokomeshi-v${V%%+*}-appstore.ipa"
          cp "$(ls build/ios/ipa/*.ipa | head -1)" "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: App Store Connect へ送る
        if: env.APPSTORE_API_KEY_ID != ''
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          # altool は PEM の解釈が厳しい。CRLF を落として末尾に改行を付ける
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" | tr -d '\r' \
            > "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_NAME" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      # Android と同じリリースに追記される。先に終わったほうが作り、後がファイルを足す。
      # App Store 版は配布証明書で署名してあるので、他人の端末には入らない
      - name: IPA を Release に添付
        if: env.IOS_APPSTORE_PROFILE_BASE64 != ''
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}
          generate_release_notes: true
          # -rc などの試し打ちタグは prerelease にする。そうしないと最新版扱いに
          # なり、アプリの「更新があります」が試し打ちを指してしまう
          prerelease: ${{ contains(github.ref_name, '-') }}
